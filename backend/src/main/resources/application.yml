server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: grantsetu-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:grantsetudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000

cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173,https://ais-dev-pexmv6qdgn7jtf4f4yv3zx-597077384066.asia-east1.run.app"
  allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  allowed-headers: "*"
